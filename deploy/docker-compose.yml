services:
  postgres:
    image: postgres:16-alpine
    container_name: fratelanza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fratelanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fratelanza_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza}
    volumes:
      - fratelanza_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fratelanza} -d ${POSTGRES_DB:-fratelanza}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lotus_net

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fratelanza_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-fratelanza}:${POSTGRES_PASSWORD:-fratelanza_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-fratelanza}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      RUN_SEED: ${RUN_SEED:-true}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    networks:
      - lotus_net

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    container_name: fratelanza_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8090}:80"
    networks:
      - lotus_net

volumes:
  fratelanza_db_data:

networks:
  lotus_net:
    driver: bridge
