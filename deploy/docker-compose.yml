services:
  postgres:
    image: postgres:16-alpine
    container_name: lotus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lotus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotus_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lotus}
    volumes:
      - lotus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lotus} -d ${POSTGRES_DB:-lotus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lotus_net

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lotus_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-lotus}:${POSTGRES_PASSWORD:-lotus_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-lotus}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      RUN_SEED: ${RUN_SEED:-true}
    networks:
      - lotus_net

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    container_name: lotus_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - lotus_net

volumes:
  lotus_db_data:

networks:
  lotus_net:
    driver: bridge
